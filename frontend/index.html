<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeShop</title>
    <link rel="stylesheet" href="/frontend/style.css">
    <script src="/frontend/script.js"></script>
</head>
<body>

<main class="container">
    <h1>SafeShop AS</h1>
    <p>Vennligst velg produkt og leveringsmetode nedenfor:</p>
    
    <h2>Våre produkter</h2>
    <div class="produkt-grid" aria-label="Produktliste">
        <div class="produkt-kort">
            <svg class="produkt-bilde" viewBox="0 0 24 24" fill="#002b49" aria-hidden="true"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            <div class="produkt-tittel">Ullgenser</div>
            <div class="produkt-pris">599,-</div>
        </div>
        <div class="produkt-kort">
            <svg class="produkt-bilde" viewBox="0 0 24 24" fill="#002b49" aria-hidden="true"><path d="M19.28 4.17a3 3 0 00-4.24 0L12 7.17 9 4.17a3 3 0 00-4.24 4.24l3 3-3 3a3 3 0 004.24 4.24l3-3 3 3a3 3 0 004.24-4.24l-3-3 3-3a3 3 0 000-4.24z"/></svg>
            <div class="produkt-tittel">Ullsokker</div>
            <div class="produkt-pris">149,-</div>
        </div>
        <div class="produkt-kort">
            <svg class="produkt-bilde" viewBox="0 0 24 24" fill="#002b49" aria-hidden="true"><path d="M12 2a10 10 0 00-10 10c0 5.52 4.48 10 10 10s10-4.48 10-10A10 10 0 0012 2zm1 17.93V18h-2v1.93c-3.95-.49-7-3.85-7-7.93h2c0 2.76 2.24 5 5 5s5-2.24 5-5h2c0 4.08-3.05 7.44-7 7.93z"/></svg>
            <div class="produkt-tittel">Ullue</div>
            <div class="produkt-pris">249,-</div>
        </div>
        <div class="produkt-kort">
            <svg class="produkt-bilde" viewBox="0 0 24 24" fill="#002b49" aria-hidden="true"><path d="M12 2c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.4c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l2.79-2.79C10.09 18.64 11.03 19 12 19c4.97 0 9-4.03 9-9s-4.03-9-9-9z"/></svg>
            <div class="produkt-tittel">Ullvotter</div>
            <div class="produkt-pris">199,-</div>
        </div>
    </div>

    <h2>Bestilling</h2>
    <form id="orderForm" onsubmit="sendBestilling(event)">
        
        <label for="kundenavn">Ditt navn:</label>
        <input type="text" id="kundenavn" required aria-required="true" placeholder="F.eks. Peder Ås">
        
        <label for="produktvalg">Velg produkt:</label>
        <select id="produktvalg">
            <option value="Ullgenser">Ullgenser (599,-)</option>
            <option value="Ullsokker">Ullsokker (149,-)</option>
            <option value="Ullue">Ullue (249,-)</option>
            <option value="Ullvotter">Ullvotter (199,-)</option>
        </select>

        <label for="fraktvalg">Velg leveringsmetode / lokasjon:</label>
        <select id="fraktvalg" required aria-required="true">
            <option value="">Vennligst velg et alternativ</option>
            <option value="Hent i butikk">Hent i butikk (SafeShop Hovedlager, Oslo - 0,-)</option>
            <option value="Posten pakke i postkassen">Posten - Pakke i postkassen (69,-)</option>
            <option value="PostNord utleveringssted">PostNord - Til nærmeste utleveringssted (39,-)</option>
        </select>
        
        <button type="submit">Fullfør bestilling</button>
    </form>
    
    <p id="statusMelding" aria-live="polite"></p>
</main>

<script src="script.js"></script>
</body>
</html>
